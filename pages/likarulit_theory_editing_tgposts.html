<script>
function csSet(sc, idx) {
  var wrap = document.getElementById('cwrap-' + sc);
  wrap.dataset.idx = idx;
  document.getElementById('main-' + sc).src = '../media/' + sc + '_' + idx + '.jpg';
  wrap.parentElement.querySelectorAll('.thumbs img').forEach(function(t, i) {
    t.classList.toggle('active', i === idx);
  });
}
function csNav(sc, dir) {
  var wrap = document.getElementById('cwrap-' + sc);
  var count = parseInt(wrap.dataset.count, 10);
  var idx = (parseInt(wrap.dataset.idx, 10) + dir + count) % count;
  csSet(sc, idx);
}
var SITE_SLUG = "likarulit";
</script>
